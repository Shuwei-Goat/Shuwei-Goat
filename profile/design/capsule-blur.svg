<svg
        width="854"
        height="230"
        xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink"
        style="z-index:1;position:relative"
        viewBox="0 0 854 230"
      >
        <style>
      .text {   font-size: 62px;   font-weight: 700;   font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif,Apple Color Emoji,Segoe UI Emoji;  } .desc {   font-size: 20px;   font-weight: 500;   font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif,Apple Color Emoji,Segoe UI Emoji;  }
      .text, .desc {   animation: scaleIn .8s ease-in-out forwards;   transform-origin: center;  } @keyframes scaleIn {   from {     transform: scale(0);   }   to {     transform: scale(1);   }  }
    </style>
        <defs>
              <linearGradient id="linear" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#669379"/><stop offset="100%" stop-color="#DCD9A9"/>
              </linearGradient>
            </defs>

      <defs>
        <filter id="blurFilter">
          <feGaussianBlur stdDeviation="12" />
        </filter>
      </defs>

          <circle
            cx="50%"
            cy="50%"
            r="57.5"
            fill="url(#linear)"
            opacity="0.2"
            filter="url(#blurFilter)"

          >
            <animate
              attributeName="cx"
              values="50%;50%;50%;50%;50%"
              dur="10s"
              begin="0s"
              repeatCount="indefinite"
              calcMode="spline"
              keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
            />
            <animate
              attributeName="cy"
              values="50%;50%;50%;50%;50%"
              dur="12s"
              begin="0s"
              repeatCount="indefinite"
              calcMode="spline"
              keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
            />
          </circle>

          <circle
            cx="45%"
            cy="50%"
            r="69"
            fill="url(#linear)"
            opacity="0.3"
            filter="url(#blurFilter)"

          >
            <animate
              attributeName="cx"
              values="45%;50%;55%;50%;45%"
              dur="30s"
              begin="1s"
              repeatCount="indefinite"
              calcMode="spline"
              keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
            />
            <animate
              attributeName="cy"
              values="50%;50%;50%;50%;50%"
              dur="36s"
              begin="1s"
              repeatCount="indefinite"
              calcMode="spline"
              keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
            />
          </circle>

          <circle
            cx="60%"
            cy="50%"
            r="64.4"
            fill="url(#linear)"
            opacity="0.15"
            filter="url(#blurFilter)"

          >
            <animate
              attributeName="cx"
              values="60%;50%;40%;50%;60%"
              dur="15s"
              begin="2s"
              repeatCount="indefinite"
              calcMode="spline"
              keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
            />
            <animate
              attributeName="cy"
              values="50%;50%;50%;50%;50%"
              dur="18s"
              begin="2s"
              repeatCount="indefinite"
              calcMode="spline"
              keySplines="0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1; 0.4 0 0.6 1"
            />
          </circle>


         <text text-anchor="middle" dominant-baseline="middle" x="50%" y="54%" class="text" style="fill:#2F4A3F;" stroke="#none" stroke-width="1" >Shuwei-Goat</text>

      </svg>
