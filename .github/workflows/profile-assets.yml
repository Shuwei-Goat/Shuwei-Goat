name: Refresh profile artwork
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-assets
  cancel-in-progress: false
jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare staging directory
        run: mkdir -p .generated
      - name: Public stats
        id: stats
        continue-on-error: true
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=Shuwei-Goat&disable_animations=true&show_icons=true&hide_rank=true&hide_border=true&title_color=45694F&text_color=354B3D&icon_color=79976B&bg_color=F5F5E9
          path: .generated/stats.svg
          token: ${{ github.token }}
      - name: Public languages
        id: languages
        continue-on-error: true
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=Shuwei-Goat&layout=compact&hide_border=true&title_color=45694F&text_color=354B3D&bg_color=F5F5E9
          path: .generated/languages.svg
          token: ${{ github.token }}
      - name: Contribution snake
        id: snake
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Shuwei-Goat
          outputs: .generated/snake.svg?color_snake=%2345694F&color_dots=%23F5F5E9,%23DCD9A9,%23C4CCA2,%239EB28A,%23669379
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Promote validated artwork only
        env:
          STATS: ${{ steps.stats.outcome }}
          LANGUAGES: ${{ steps.languages.outcome }}
          SNAKE: ${{ steps.snake.outcome }}
        run: python3 scripts/promote.py
      - name: Refresh public service snapshots
        run: python3 scripts/refresh.py --only typing-game
      - name: Commit successful changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile evidence/service-status.json evidence/action-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public profile artwork'
            git push
          fi
      - name: Report component failures
        run: python3 scripts/check_status.py
