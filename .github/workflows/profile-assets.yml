name: Refresh profile artwork
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-assets
  cancel-in-progress: false
jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh animated username
        run: python3 scripts/refresh.py --only typing-game
      - name: Commit successful changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/typing-game.svg evidence/service-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh profile artwork'
            git push
          fi
      - name: Check refresh result
        run: python3 -c "import json; from pathlib import Path; result=json.loads(Path('evidence/service-status.json').read_text())['typing-game']; assert result['state']=='ok', result.get('error', 'Refresh failed')"
